{{ define "main" }}

  <ul class="list">
    {{ $items := first 20 (where .Site.RegularPages "Type" "in" .Site.Params.mainSections) }}
    {{ range $items }}
      {{ .Render "summary" }}
    {{ end }}
  </ul>
  <p class="see-more"><a href="/archive">Read more</a></p>

  {{ partial "h-card.html" . }}

{{ end }}
