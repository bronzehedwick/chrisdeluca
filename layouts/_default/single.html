{{ define "main" }}
<article class="h-entry post">
  <section class="e-content post-body">
      {{ .Content }}
  </section>
  <footer id="post-meta">
    <a href="/">
      {{ partial "avatar.html" . }}
    </a>
    <div class="post-meta__links">
      <p class="p-author h-card dark"><a href="/">{{ .Site.Params.author.name }}</a></p>
      <p><a href="https://micro.blog/{{ .Site.Params.author.username }}">@{{ .Site.Params.author.username }}</a></p>
    </div>
  </footer>

  {{ if .Site.Params.include_conversation }}
    <script src="https://micro.blog/conversation.js?url={{ .Permalink }}" defer></script>
  {{ end }}
</article>
{{ end }}
