<nav class="breadcrumbs" aria-label="Breadcrumbs">
  <ol>
    {{- range .Ancestors.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">
        {{ if .IsHome }}
          Home
        {{ else }}
          {{ .Title }}
        {{ end }}
      </a>
    </li>
    {{- end }}
    <li class="active">
      <a href="{{ .RelPermalink }}" aria-current="page">{{ .Title }}</a>
    </li>
  </ol>
</nav>
